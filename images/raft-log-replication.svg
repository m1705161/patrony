<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
<marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
</defs>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="20" y="36" font-size="22" font-weight="700" fill="#0f172a">Raft — leader-based replication</text>
<text x="20" y="66" font-size="16" font-weight="700" fill="#1d4ed8">1. Leader election (term-based)</text>
<rect x="400" y="90" width="200" height="64" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="500.0" y="114" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">S1 · Leader</text>
<text x="500.0" y="135" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">term 3</text>
<rect x="40" y="90" width="200" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="140.0" y="114" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">S2 · Follower</text>
<text x="140.0" y="135" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">term 3</text>
<rect x="760" y="90" width="200" height="64" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="860.0" y="114" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">S3 · Follower</text>
<text x="860.0" y="135" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">term 3</text>
<line x1="400" y1="122" x2="240" y2="122" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr)" />
<line x1="600" y1="122" x2="760" y2="122" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr)" />
<line x1="240" y1="146" x2="400" y2="146" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrd)" stroke-dasharray="5,4"/>
<text x="320" y="114" font-size="12.5" fill="#1d4ed8" text-anchor="middle">AppendEntries (heartbeat)</text>
<text x="680" y="114" font-size="12.5" fill="#1d4ed8" text-anchor="middle">AppendEntries (heartbeat)</text>
<text x="320" y="168" font-size="12.5" fill="#b45309" text-anchor="middle">RequestVote (timeout → Candidate)</text>
<text x="20" y="190" font-size="12.5" fill="#475569">A follower becomes Candidate after an election timeout and requests votes; the node that wins a majority of votes becomes the new leader (term increments).</text>
<text x="20" y="234" font-size="16" font-weight="700" fill="#1d4ed8">2. Log replication (AppendEntries)</text>
<rect x="400" y="250" width="200" height="96" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="500.0" y="272" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">S1 · Leader</text>
<rect x="412" y="284" width="38" height="30" rx="4" fill="#16a34a"/>
<text x="431.0" y="305" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<rect x="458" y="284" width="38" height="30" rx="4" fill="#16a34a"/>
<text x="477.0" y="305" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<rect x="504" y="284" width="38" height="30" rx="4" fill="#16a34a"/>
<text x="523.0" y="305" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<rect x="550" y="284" width="38" height="30" rx="4" fill="#16a34a"/>
<text x="569.0" y="305" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<rect x="40" y="250" width="200" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="140.0" y="272" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">S2 · Follower</text>
<rect x="52" y="284" width="38" height="30" rx="4" fill="#16a34a"/>
<text x="71.0" y="305" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<rect x="98" y="284" width="38" height="30" rx="4" fill="#16a34a"/>
<text x="117.0" y="305" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<rect x="144" y="284" width="38" height="30" rx="4" fill="#16a34a"/>
<text x="163.0" y="305" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<rect x="190" y="284" width="38" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="4,3"/>
<rect x="760" y="250" width="200" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="860.0" y="272" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">S3 · Follower</text>
<rect x="772" y="284" width="38" height="30" rx="4" fill="#16a34a"/>
<text x="791.0" y="305" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<rect x="818" y="284" width="38" height="30" rx="4" fill="#16a34a"/>
<text x="837.0" y="305" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<rect x="864" y="284" width="38" height="30" rx="4" fill="#16a34a"/>
<text x="883.0" y="305" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<rect x="910" y="284" width="38" height="30" rx="4" fill="#16a34a"/>
<text x="929.0" y="305" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<line x1="400" y1="320" x2="240" y2="320" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr)" />
<line x1="600" y1="320" x2="760" y2="320" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr)" />
<text x="320" y="312" font-size="12.5" fill="#1d4ed8" text-anchor="middle">AppendEntries (entries 3–4)</text>
<text x="680" y="312" font-size="12.5" fill="#1d4ed8" text-anchor="middle">AppendEntries (entry 4)</text>
<text x="20" y="388" font-size="14" font-weight="700" fill="#0f172a">Legend</text>
<rect x="20" y="398" width="22" height="15" rx="3" fill="#16a34a"/>
<text x="50" y="411" font-size="13" fill="#0f172a">committed log entry</text>
<rect x="210" y="398" width="22" height="15" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="4,3"/>
<text x="240" y="411" font-size="13" fill="#0f172a">missing / not yet replicated (follower catches up)</text>
<text x="20" y="452" font-size="12.5" fill="#475569">An entry is committed once it is replicated to a majority of servers (here 2 of 3).</text>
<text x="20" y="472" font-size="12.5" fill="#475569">On leader failure, the new leader's log wins and followers overwrite conflicting entries (log-matching property).</text>
<text x="20" y="500" font-size="11" fill="#94a3b8">Self-made diagram (CC0), based on Ongaro &amp; Ousterhout, "In Search of an Understandable Consensus Algorithm" (USENIX ATC 2014).</text>
</svg>